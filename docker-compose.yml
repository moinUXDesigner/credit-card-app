services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ccapp-php
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-credit_card_app}
      - DB_USERNAME=${DB_USERNAME:-ccapp}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ccapp-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ccapp-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ccapp-net

  mysql:
    image: mysql:8.0
    container_name: ccapp-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-credit_card_app}
      - MYSQL_USER=${DB_USERNAME:-ccapp}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ccapp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ccapp-net

volumes:
  ccapp-mysql-data:

networks:
  ccapp-net:
    driver: bridge
